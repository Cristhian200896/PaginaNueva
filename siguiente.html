<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Semilla - Menú Completo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../estilos/estilo2.css">
</head>
<body>

    <!-- PÁGINA DEL MENÚ (Fondo Mostaza Completo) -->
    <div class="menu-page-wrapper">
        
        <!-- Botón flotante para regresar a la página principal -->
        <a href="paginaNueva.html" class="btn-close-menu">&times;</a>
        
        <div class="menu-overlay-content">
            <!-- Encabezado del menú -->
            <div class="menu-header">
                <div class="leaf-deco">🍃</div>
                <h2 class="menu-overlay-title">MENU</h2>
                <div class="leaf-deco">🍃</div>
            </div>

            <!-- Cuadrícula (Grid) de las 6 páginas de menú (3 columnas en PC) -->
            <div class="menu-pages-grid">
                <!-- Página 1 (Portada) -->
                <div class="menu-page-card">
                    <div class="menu-page-mockup cover-page">
                        <span class="mock-sun">☀️</span>
                        <h3 class="mock-title">la semilla</h3>
                        <p class="mock-meta">PLANT-BASED LATIN ATLANTA, GA</p>
                    </div>
                </div>
                <!-- Página 2 -->
                <div class="menu-page-card">
                    <div class="menu-page-mockup text-page">
                        <h4>para picar</h4>
                        <div class="mock-line"></div>
                        <div class="mock-line"></div>
                        <h4>platos fuertes</h4>
                        <div class="mock-box"></div>
                    </div>
                </div>
                <!-- Página 3 -->
                <div class="menu-page-card">
                    <div class="menu-page-mockup text-page">
                        <h4>bebidas</h4>
                        <div class="mock-line"></div>
                        <div class="mock-line"></div>
                        <h4>postres</h4>
                        <div class="mock-line"></div>
                    </div>
                </div>
                <!-- Página 4 -->
                <div class="menu-page-card">
                    <div class="menu-page-mockup graphic-page">
                        <div class="mock-badge">NOSOTROS</div>
                        <div class="mock-paragraph"></div>
                    </div>
                </div>
                <!-- Página 5 -->
                <div class="menu-page-card">
                    <div class="menu-page-mockup text-page">
                        <h4>cocktails</h4>
                        <div class="mock-line"></div>
                        <div class="mock-line"></div>
                    </div>
                </div>
                <!-- Página 6 -->
                <div class="menu-page-card">
                    <div class="menu-page-mockup text-page">
                        <h4>vinos & cervezas</h4>
                        <div class="mock-line"></div>
                        <div class="mock-line"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        if (performance.navigation.type === performance.navigation.TYPE_RELOAD) {
            window.location.href = "paginaNueva.html";
        }
    </script>

</body>
</html>
