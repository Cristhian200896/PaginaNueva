<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>La Semilla - Reserve</title>
    <link rel="stylesheet" href="../estilos/reserve.css">
</head>
<body>

    <section class="reserve-container">
        <div class="reserve-info">
            <span class="subtitle">A LA MESA</span>
            <h2>Reserva una Experiencia</h2>
            <p>Te recomendamos reservar con anticipación para asegurar tu lugar. Dejamos una parte de nuestra sala para clientes sin reserva previa de manera espontánea.</p>
            <div class="info-details">
                <p><strong>Horarios:</strong> Mar - Sáb: 5:00 PM - 11:00 PM</p>
                <p><strong>Teléfono:</strong> +51 987 654 321</p>
            </div>
        </div>

        <div class="reserve-form-box">
            <form>
                <div class="form-row">
                    <div class="input-group">
                        <label for="date">Fecha</label>
                        <input type="date" id="date" required>
                    </div>
                    <div class="input-group">
                        <label for="time">Hora</label>
                        <input type="time" id="time" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="guests">Número de Personas</label>
                    <select id="guests">
                        <option value="1">1 Persona</option>
                        <option value="2" selected>2 Personas</option>
                        <option value="3">3 Personas</option>
                        <option value="4">4 Personas</option>
                        <option value="5+">5+ Personas</option>
                    </select>
                </div>

                <div class="input-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" placeholder="ejemplo@correo.com" required>
                </div>

                <button type="submit" class="btn-submit">SOLICITAR MESA</button>
            </form>
        </div>
    </section>

    <script>
        if (performance.navigation.type === performance.navigation.TYPE_RELOAD) {
            window.location.href = "paginaNueva.html";
        }
    </script>

    <script>
    document.querySelector('form').addEventListener('submit', function(e) {
        e.preventDefault(); // Evita que la página se recargue
        alert('¡Reserva solicitada con éxito!');
    });
    </script>

</body>
</html>
